name: 139strm
services:
  139strm:
    image: tianjian518/139strm:2.2.25     # 如需从源码构建，把这行换成：build: .
    container_name: 139strm
    restart: unless-stopped
    # host 网络：与 Smart 一致，便于同机部署的 Emby/Jellyfin 直连 8025。
    # 注意：使用 host 模式时不能同时配置 ports，会被忽略。
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./strm:/strm
    environment:
      - PORT=8025
      - CONFIG_PATH=/app/config/config.json
      - YUN139_OUTPUT_DIR=/strm
      - TZ=Asia/Shanghai
